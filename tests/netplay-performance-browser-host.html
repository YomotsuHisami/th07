<!doctype html>
<meta charset="utf-8">
<title>TH07 MP performance and determinism fixture</title>
<iframe id="runtime" style="width:640px;height:480px;border:0"></iframe>
<pre id="status">boot</pre>
<script>
(() => {
  "use strict";
  const protocol = "eagler-touhou/1";
  const game = "th07";
  const params = new URLSearchParams(location.search);
  const player = Number(params.get("player") || 0);
  const playerCount = Number(params.get("players") || 2);
  const iframe = document.getElementById("runtime");
  const pending = new Map();
  let request = 0;
  function send(command, body = {}) {
    const id = `th07-perf-${++request}`;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error(`${command} timeout`));
      }, 30000);
      pending.set(id, { resolve, reject, timer });
      iframe.contentWindow.postMessage(
        { protocol, game, command, request: id, ...body }, location.origin);
    });
  }
  window.addEventListener("message", async event => {
    if (event.source !== iframe.contentWindow || event.origin !== location.origin) return;
    const message = event.data || {};
    if (message.protocol !== protocol || message.game !== game) return;
    if (message.request && pending.has(message.request)) {
      const waiter = pending.get(message.request);
      pending.delete(message.request);
      clearTimeout(waiter.timer);
      if (message.ok) waiter.resolve(message);
      else waiter.reject(new Error(message.error || "runtime request failed"));
      return;
    }
    if (message.event !== "ready") return;
    try {
      await send("configure", {
        music: "none", resources: [],
        sharedResources: [{ url: "/assets/msgothic.ttc", path: "/msgothic.ttc" }],
        thpracCatalog: [],
        options: {
          debugHarness: "netplay-lan-stage1", netplayMode: "lan",
          netplayUrl: params.get("relay"), netplayPlayer: player,
          netplayPlayerCount: playerCount,
          netplayInputDelayFrames: Number(params.get("inputDelay") ?? 3),
          netplayMaxPredictionFrames: Number(params.get("predictionWindow") ?? 12),
          netplayTouchPrediction: params.get("prediction") || "legacy",
          netplayTouchWorkload: params.get("trace") || "default",
          netplayPerfTelemetry: true,
          netplayTestIncrementalTouch: params.get("touchStream") === "delta",
          netplayTestNoRollback: params.get("noRollback") === "1",
          netplayTestDenseBullets: Number(params.get("denseBullets") || 0),
          touchEnabled: params.get("physicalTouch") === "1",
          touchMovementMode: "touch", touchFocusMode: "two-finger",
          netplayTestFrames: Number(params.get("frames") || 900),
          netplaySeed: 19005, netplayDifficulty: 1, netplayIceServers: [],
          netplayLoadouts: [
            { character: 0, shot: 0 }, { character: 1, shot: 1 },
            { character: 2, shot: 0 },
          ].slice(0, playerCount),
          netplayPhysicalInput: params.get("physicalTouch") === "1",
          netplayScriptedInput: params.get("physicalTouch") !== "1",
          // Reuse the existing alternating joystick/direct-touch stimulus.
          // This fixture requires TH_DEV_TOOLS=OFF: no Replay-menu cycle.
          netplayReplayPlaybackCycle: params.get("analog") === "1",
        },
      });
      await send("launch");
      document.getElementById("status").textContent = "launched";
    } catch (error) {
      globalThis.__th07PerfFailure = String(error?.message || error);
      document.getElementById("status").textContent = globalThis.__th07PerfFailure;
    }
  });
  const build = params.get("build") || "build-web-th07-netplay";
  if (!/^[A-Za-z0-9_.-]+$/.test(build)) throw new Error("invalid test build directory");
  iframe.src = `/${build}/th07.html?hosted=1&runtimeVariant=multiplayer`;
})();
</script>
